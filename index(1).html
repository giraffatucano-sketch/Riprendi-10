function updateComposeHelp(){const box=document.getElementById('category-help');if(!box)return;const chosen=draftCats.length?draftCats:[0];box.innerHTML=chosen.map(i=>'<p class="small" style="margin:5px 0"><b>'+esc(CATS[i])+':</b> '+esc(CAT_DESCS[i])+'</p>').join('');const state=document.querySelector('input[name="state"]:checked')?.value||'CI SONO';const idx=state==='CI SONO'?0:1;const example=CAT_EXAMPLES[chosen[0]][idx];const title=document.querySelector('input[name="title"]');const detail=document.querySelector('textarea[name="details"]');if(title)title.placeholder='Es. '+example;if(detail)detail.placeholder='Descrivi concretamente: '+example.toLowerCase()+'. Quando, dove e in che modo?';}

function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2800)}function go(p){if(p==='post'&&page!=='post'&&page!=='compose')postOrigin=page;page=p;render();scrollTo(0,0)}function header(title,back='surface'){return `<div class="topline"><button class="back" onclick="go('${back}')">‹</button><h2>${title}</h2><span style="width:22px"></span></div>`}function nav(){return `<nav class="nav"><button class="${page==='surface'?'active':''}" onclick="go('surface')">≋<br>Superficie</button><button class="${page==='cards'?'active':''}" onclick="go('cards')">▤<br>Carte</button><button class="plus" onclick="newPost()">+</button><button class="${page==='calendar'?'active':''}" onclick="go('calendar')">▦<br>Calendario</button><button class="${page==='me'?'active':''}" onclick="go('me')">♙<br>Io</button></nav>`}function img(){return 'logo-originale.png'}function imglogo(cls='',style=''){return `<img class="logo ${cls}" src="${img()}" style="${style}" alt="Logo originale: persone che emergono come getti d’acqua da una tazzina">`}function base(s,withNav=true,cls=''){app.innerHTML=`<main class="screen ${cls}">${s}</main>${withNav?nav():''}`;if(page==='compose'){updateComposeHelp();objectOptions()}}
function render(){if(page==='home')return base(`<div class="home center">${imglogo('','width:92%')}<div class="brand">riprendi</div><div class="serif" style="font-size:27px;color:var(--blue)">Carta dell’Abitante</div><div class="serif" style="font-size:22px;color:var(--blue)">— m zero —</div><div class="motto">Perché cercare fuori quello che potresti avere accanto?</div><h3 class="serif" style="font-size:23px">Tucidide 56 · Mettiamo in circolo quello che c’è.</h3><div class="stack"><button class="btn" onclick="go('intro')">Entra →</button></div></div>`,false);
if(page==='intro')return base(`${imglogo('watermark')}<div class="copy">${header('','home')}<h2>A Tucidide c’è molto di più di quello che sappiamo.</h2><p>Vivono e lavorano centinaia di persone. Persone che sanno fare cose, che hanno idee, mestieri, passioni, oggetti, esperienze. Che qualche volta hanno bisogno e qualche volta hanno voglia di esserci.</p><h3>La <strong>Carta dell’Abitante</strong> serve a scoprirlo e metterlo in circolo.</h3><p>Non crea obblighi e non pretende disponibilità continua. Ognuno decide liberamente cosa offrire, quando e a chi, per rendere la vita un po’ più facile e magari anche più bella.</p><div class="card"><h3 class="serif" style="font-size:25px">Ci conosciamo?</h3><p style="margin:0">Un appuntamento in circolo con presentazioni brevi, semplici, concrete.</p></div><div style="height:17px"></div><button class="btn" onclick="go('surface')">Continua →</button></div>`,false,'info');

function expired(p){return !p.done&&((p.expires&&Date.now()>p.expires)||(p.dates?.length&&p.dates.every(d=>new Date(d+'T23:59:59').getTime()<Date.now())))}function item(p){return `<div class="item ${p.done?'done':''}" onclick="selectedPost=${p.id};go('post')"><span class="tag ${p.done?'done-tag':p.state==='MI SERVE ORA'?'urgent':''}">${p.done?'✓ GIÀ FATTO!':esc(p.state)}</span><h3>${esc(p.title)}</h3><div class="meta">di ${esc(p.author)} · ${p.dates?.length?p.dates.length+' date proposte':'Date da concordare'}</div><div class="tiny muted" style="margin-top:7px">${p.cats.map(i=>esc(CATS[i])).join(' · ')}</div></div>`}
function openSource(event,i){const el=event.currentTarget;if(el.disabled)return;el.disabled=true;el.classList.add('wave-playing');window.setTimeout(()=>{selectedCat=i;filter='TUTTI';go('list')},950)}function newPost(cat){editing=null;draftDates=[];rangeAutoDates=[];draftCats=Number.isInteger(cat)?[cat]:[];draftImage='';pickerMonth=new Date();returnPage=page;go('compose')}function editPost(id){editing=id;rangeAutoDates=[];let p=data.proposals.find(x=>x.id===id);draftDates=[...(p.dates||[])];draftCats=[...p.cats];draftImage=p.image||'';pickerMonth=new Date((draftDates[0]||localISO(new Date()))+'T12:00:00');returnPage='post';go('compose')}function toggleCat(i){draftCats=draftCats.includes(i)?draftCats.filter(x=>x!==i):[...draftCats,i];document.querySelectorAll('#postform .chips button').forEach(b=>{let idx=CATS.findIndex(c=>b.textContent===c);if(idx>=0)b.classList.toggle('on',draftCats.includes(idx))});let prof=document.getElementById('professional-options');if(prof)prof.style.display=draftCats.includes(3)?'':'none';updateComposeHelp()}function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function quarterSelect(name,value='',label='Orario'){let opts=[''].concat(Array.from({length:96},(_,i)=>String(Math.floor(i/4)).padStart(2,'0')+':'+String(i%4*15).padStart(2,'0')));return `<select name="${name}" aria-label="${label}">${opts.map(t=>`<option value="${t}" ${t===value?'selected':''}>${t||'Da concordare'}</option>`).join('')}</select>`}
function todayISO(){return localISO(new Date())}
function activeToday(p){if(p.done||expired(p))return false;let ds=p.dates||[];return !ds.length||ds.includes(todayISO())||!!(p.rangeFrom&&p.rangeTo&&p.rangeFrom<=todayISO()&&p.rangeTo>=todayISO())}
function careNote(){return `<div class="status object-note">“Ogni prestito nasce dalla fiducia, vive nella cura e si rinnova attraverso la riconoscenza.”</div>`}
function objectOptions(){let f=document.getElementById('postform');if(!f)return;let mode=f.querySelector('input[name="objectMode"]:checked')?.value||'Prestito';let note=document.getElementById('object-care');let rental=document.getElementById('object-rental');if(note)note.style.display=mode==='Regalo'?'none':'';if(rental)rental.style.display=mode==='Noleggio'?'':'none'}
function fillRange(){let f=document.getElementById('postform');if(!f)return;let a=f.rangeFrom.value,b=f.rangeTo.value;if(!a||!b)return;if(b<a)return toast('Controlla le date dell’intervallo');draftDates=draftDates.filter(d=>!rangeAutoDates.includes(d));rangeAutoDates=[];let cur=new Date(a+'T12:00:00'),end=new Date(b+'T12:00:00');let n=0;while(cur<=end&&n<370){let d=localISO(cur);if(!draftDates.includes(d)){draftDates.push(d);rangeAutoDates.push(d)}cur.setDate(cur.getDate()+1);n++}draftDates.sort();document.getElementById('date-picker').innerHTML=datePicker();toast('Intervallo selezionato')}
function datePicker(){let year=pickerMonth.getFullYear(),month=pickerMonth.getMonth(),first=new Date(year,month,1),last=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7,today=localISO(new Date());let cells=Array.from({length:offset},()=>'<span></span>').join('');for(let day=1;day<=last;day++){let d=localISO(new Date(year,month,day)),selected=draftDates.includes(d);cells+=`<button type="button" class="day ${selected?'chosen':''}" ${d<today?'disabled':''} onclick="toggleDate('${d}')">${day}</button>`}return `<div class="cal-head"><button type="button" class="btn ghost small" onclick="moveMonth(-1)">‹</button><b>${first.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</b><button type="button" class="btn ghost small" onclick="moveMonth(1)">›</button></div><div class="day-grid">${['L','M','M','G','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${cells}</div><p class="tiny muted">${draftDates.length?draftDates.map(d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT')).join(' · '):'Da concordare (nessuna data selezionata).'}</p>`}
function moveMonth(n){pickerMonth=new Date(pickerMonth.getFullYear(),pickerMonth.getMonth()+n,1);document.getElementById('date-picker').innerHTML=datePicker()}
function toggleDate(d){draftDates=draftDates.includes(d)?draftDates.filter(x=>x!==d):[...draftDates,d].sort();document.getElementById('date-picker').innerHTML=datePicker()}
function addDate(){let d=document.getElementById('dateadd').value;if(!d)return toast('Seleziona prima una data');if(!draftDates.includes(d))draftDates.push(d);draftDates.sort();refreshCompose()}function removeDate(i){draftDates.splice(i,1);refreshCompose()}function refreshCompose(){let f=document.getElementById('postform');let v={title:f.title.value,details:f.details.value,state:f.state.value,duration:f.duration.value,private:f.private.checked,paidAfter:f.paidAfter?.checked||false,time:f.time.value,timeFrom:f.timeFrom.value,timeTo:f.timeTo.value,objectMode:f.querySelector('input[name="objectMode"]:checked')?.value,rentalPrice:f.rentalPrice?.value,rangeFrom:f.rangeFrom?.value,rangeTo:f.rangeTo?.value};render();f=document.getElementById('postform');f.title.value=v.title;f.details.value=v.details;f.querySelector('input[name=state][value="'+v.state+'"]').checked=true;f.duration.value=v.duration;f.private.checked=v.private;if(f.paidAfter)f.paidAfter.checked=v.paidAfter;f.time.value=v.time;f.timeFrom.value=v.timeFrom;f.timeTo.value=v.timeTo;if(v.objectMode){let radio=f.querySelector('input[name="objectMode"][value="'+v.objectMode+'"]');if(radio)radio.checked=true}if(f.rentalPrice)f.rentalPrice.value=v.rentalPrice||"";if(f.rangeFrom)f.rangeFrom.value=v.rangeFrom||"";if(f.rangeTo)f.rangeTo.value=v.rangeTo||"";updateComposeHelp();objectOptions()}function readPostImage(e){const f=e.target.files[0];if(f)compress(f,s=>draftImage=s)}function readProfileImage(e){const f=e.target.files[0];if(f)compress(f,s=>{data.profile.image=s;save();toast('Immagine scelta: salva la Carta per completare')})}function compress(file,cb){let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');let z=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)}
function submitPost(e){e.preventDefault();let f=e.target;if(!data.profile.name)return toast('Prima compila la tua Carta personale');if(!draftCats.length)return toast('Scegli almeno una sorgente');let duration=Number(f.duration.value);let fields={title:f.title.value.trim(),details:f.details.value.trim(),cats:[...draftCats],dates:[...draftDates],state:f.state.value,private:f.private.checked,paidAfter:!!(draftCats.includes(3)&&f.paidAfter?.checked),objectMode:draftCats.includes(5)?f.querySelector('input[name="objectMode"]:checked')?.value||"Prestito":null,rentalPrice:draftCats.includes(5)&&f.querySelector('input[name="objectMode"]:checked')?.value==="Noleggio"?f.rentalPrice?.value||"":null,feeUnit:null,feeAmount:null,rangeFrom:f.rangeFrom?.value||"",rangeTo:f.rangeTo?.value||"",time:f.time.value,timeFrom:f.timeFrom.value,timeTo:f.timeTo.value,expires:duration?Date.now()+duration*3600000:null};if(editing){Object.assign(data.proposals.find(x=>x.id===editing),fields);selectedPost=editing}else{selectedPost=Date.now();data.proposals.unshift({id:selectedPost,author:data.profile.name,owner:true,done:false,created:Date.now(),...fields})}save();toast('Proposta salvata');go('post')}
function saveProfile(e){e.preventDefault();let f=e.target;data.profile.name=f.name.value.trim();data.profile.phrase=f.phrase.value.trim();save();toast('Carta salvata sul dispositivo');go('me')}function toggleDone(id){let p=data.proposals.find(x=>x.id===id);p.done=!p.done;save();toast(p.done?'Segnata come Già fatto!':'Proposta riattivata');render()}function removePost(id){if(!confirm('Eliminare questa proposta?'))return;data.proposals=data.proposals.filter(p=>p.id!==id);save();go('myPosts')}function openChat(id){let p=data.proposals.find(x=>x.id===id);let i=data.threads.findIndex(t=>t.postId===id);if(i<0){i=data.threads.length;data.threads.push({postId:id,with:p.author,title:p.title,messages:[]});save()}selectedThread=i;go('chat')}function sendMessage(e){e.preventDefault();let text=e.target.text.value.trim();if(!text)return;data.threads[selectedThread].messages.push({mine:true,text});save();toast('Messaggio salvato nella demo (non inviato)');render()}
render();
</script></body></html>
